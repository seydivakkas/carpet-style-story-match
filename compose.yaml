services:
  postgres:
    image: postgres:16-alpine
    container_name: carpet_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: carpet_user
      POSTGRES_PASSWORD: carpet_password
      POSTGRES_DB: carpet_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carpet_user -d carpet_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: carpet_api
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://carpet_user:carpet_password@postgres:5432/carpet_db
      API_HOST: 0.0.0.0
      API_PORT: 8000
      WEB_ORIGIN: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: carpet_web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
