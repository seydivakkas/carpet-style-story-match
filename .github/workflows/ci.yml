name: Zorunlu kalite kontrolleri
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  backend-ubuntu:
    name: backend-ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bağımlılıkları kur
        run: python -m pip install -e "./apps/api[dev,s3]"
      - name: Tanımsız Python adlarını tara
        working-directory: apps/api
        run: python -m ruff check app ../../packages --select F821
      - name: API testleri
        working-directory: apps/api
        env:
          APP_ENV: test
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
        run: python -m pytest tests/ -q
  backend-windows:
    name: backend-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bağımlılıkları kur
        run: python -m pip install -e "./apps/api[dev,s3]"
      - name: Windows testleri
        working-directory: apps/api
        env:
          APP_ENV: test
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
        run: python -m pytest tests/ -q
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
  docker:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose yapılandırması
        env:
          POSTGRES_PASSWORD: test_only
          MINIO_ROOT_PASSWORD: test_only
          MINIO_IMAGE: dappros/minio:RELEASE.2025-09-07T16-13-09Z
          MINIO_ROOT_USER: carpet_ci
        run: docker compose -f docker-compose.prod.yml config --quiet
      - name: Üretim imajı derle
        env:
          POSTGRES_PASSWORD: test_only
          MINIO_ROOT_PASSWORD: test_only
          MINIO_IMAGE: dappros/minio:RELEASE.2025-09-07T16-13-09Z
          MINIO_ROOT_USER: carpet_ci
        run: docker compose -f docker-compose.prod.yml build api web

  backend-security-smoke:
    name: backend-security-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bağımlılıkları kur
        run: python -m pip install -e "./apps/api[dev,s3]"
      - name: Üretim negatif yetki testleri ve dosya güvenliği
        working-directory: apps/api
        env:
          APP_ENV: test
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
        run: python -m pytest tests/test_analysis_access_control.py tests/test_storage_security_new.py -q
  motif-evidence-inventory:
    name: motif-evidence-inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kanıt dosyaları envanteri (FAIL/HOLD gizlenmez)
        run: python scripts/motif_evidence_audit.py --output artifacts/motif-evidence-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: motif-evidence-inventory
          path: artifacts/motif-evidence-audit.json

  backend-postgresql-schema:
    name: backend-postgresql-schema
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: carpet_ci
          POSTGRES_PASSWORD: ci_temporary_only
          POSTGRES_DB: carpet_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U carpet_ci -d carpet_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      APP_ENV: test
      DATABASE_URL: "postgresql+asyncpg://carpet_ci:ci_temporary_only@localhost:5432/carpet_ci"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python bağımlılıkları
        run: python -m pip install -e "./apps/api[dev,s3]"
      - name: Boş PostgreSQL üzerinde Alembic upgrade head
        working-directory: apps/api
        run: python -m alembic upgrade head
      - name: Sahiplik alanı ve Alembic sürümünü doğrula
        working-directory: apps/api
        run: python -m app.scripts.verify_postgres_schema

  backend-minio-integration:
    name: backend-minio-integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bağımlılıkları yükle
        run: python -m pip install -e "./apps/api[dev,s3]"
      - name: Geçici gerçek MinIO servisi aç
        run: |
          docker run -d --name carpet-minio-ci -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER=carpet_ci \
            -e MINIO_ROOT_PASSWORD=ci_testing_only_password \
            dappros/minio:RELEASE.2025-09-07T16-13-09Z server /data
      - name: S3 görsel yaşam döngüsü kabulü
        working-directory: apps/api
        env:
          APP_ENV: test
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          STORAGE_BACKEND: s3
          S3_ENDPOINT_URL: http://127.0.0.1:9000
          S3_BUCKET_NAME: carpet-ci
          S3_ACCESS_KEY: carpet_ci
          S3_SECRET_KEY: ci_testing_only_password
          S3_SECURE: "false"
        run: python -m app.scripts.verify_minio_storage

  backend-redis-integration:
    name: backend-redis-integration
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python bağımlılıkları
        run: python -m pip install -e "./apps/api[dev,s3]"
      - name: Paylaşımlı atomik kota
        working-directory: apps/api
        env:
          APP_ENV: test
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
        run: python -m pytest tests/test_redis_shared_rate_limit.py -q
