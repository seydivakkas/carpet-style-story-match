name: Zorunlu kalite kontrolleri
on:
  push:
    branches: [master, "fix/**"]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  backend-ubuntu:
    name: backend-ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bağımlılıkları kur
        run: python -m pip install -e "./apps/api[dev,s3]"
      - name: API testleri
        working-directory: apps/api
        env:
          APP_ENV: test
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
        run: python -m pytest tests/ -q
  backend-windows:
    name: backend-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bağımlılıkları kur
        run: python -m pip install -e "./apps/api[dev,s3]"
      - name: Windows testleri
        working-directory: apps/api
        env:
          APP_ENV: test
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
        run: python -m pytest tests/ -q
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
  docker:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose yapılandırması
        env:
          POSTGRES_PASSWORD: test_only
          MINIO_ROOT_PASSWORD: test_only
        run: docker compose -f docker-compose.prod.yml config --quiet
      - name: Üretim imajı derle
        env:
          POSTGRES_PASSWORD: test_only
          MINIO_ROOT_PASSWORD: test_only
        run: docker compose -f docker-compose.prod.yml build api web
