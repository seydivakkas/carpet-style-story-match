[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "carpet-style-story-match-api"
version = "0.1.0"
description = "FastAPI Backend for Carpet Style & Story Match"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "httpx>=0.27.0",
    "opencv-python-headless>=4.9.0",
    "pillow>=10.2.0",
    "python-multipart>=0.0.9",
    "beautifulsoup4>=4.12.0,<5.0",
    "jsonschema>=4.21.0,<5.0",
    "redis>=5.0,<7.0"
]

[project.optional-dependencies]
s3 = ["boto3>=1.34,<2.0"]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0"
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
